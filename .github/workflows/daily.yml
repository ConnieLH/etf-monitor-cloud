name: daily-report

on:
  schedule:
    # 避开整点拥堵并拉大间隔：北京时间 17:13、18:19、19:43，以及次日开盘前 07:23 兜底（非高峰段）
    - cron: '13 9 * * 1-5'
    - cron: '19 10 * * 1-5'
    - cron: '43 11 * * 1-5'
    - cron: '23 23 * * 1-5'
  workflow_dispatch: {}

permissions:
  # contents: write 用于把 history/ 的每日数据提交回仓库。
  # 这些提交同时算作仓库活动，避免公开仓库 60 天无活动后定时任务被 GitHub 自动停用。
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python three_index_report.py --start-date 2020-01-01 --output-dir output --history-dir history

      - name: Upload freshness diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: source-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/source_freshness.json
          if-no-files-found: warn
          overwrite: true

      - name: Check for new data
        id: changes
        run: |
          git add -A history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "history/ 没有新数据：今天的报告已经发布过，本次跳过部署。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare site
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p site
          cp output/report.html site/index.html
          cp output/data_snapshot.json site/data_snapshot.json

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布报告本身，不把源码、测试和 README 一起公开到网页上。
          path: site

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署成功后再提交历史：如果部署失败，下一次定时运行仍会看到“有新数据”并重新部署。
      - name: Commit history
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_DATE=$(python -c "import json;print(json.load(open('output/data_snapshot.json'))['data_cutoff'])")
          git commit -m "data: ${DATA_DATE} 每日快照"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 仅在当晚最后一次重试、次日开盘前兜底或手动运行失败时发送 Issue 告警，避免偶发波动刷屏。
      - name: Notify failure via Issue
        if: failure() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '43 11 * * 1-5' || github.event.schedule == '23 23 * * 1-5')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_DESC: ${{ github.event_name }} (${{ github.event.schedule || 'manual' }})
        run: |
          TITLE="[告警] 每日报告生成失败"
          BODY=$(python - <<'PY'
          import json, os
          from pathlib import Path

          lines = [
              "每日 ETF 监控报告任务失败，请检查数据源或手动补跑：",
              f"- 触发方式：{os.environ['EVENT_DESC']}",
              f"- 运行记录：{os.environ['RUN_URL']}",
          ]
          freshness_file = Path("output/source_freshness.json")
          if freshness_file.exists():
              data = json.loads(freshness_file.read_text(encoding="utf-8"))
              lines.append(f"- 期望交易日：{data.get('expected_trading_day')}")
              lines.append(f"- 交易日历状态：{data.get('trade_calendar')}")
              lines.append(f"- 滞后数据源：{data.get('stale_required_sources')}")
              if data.get("freshness_error"):
                  lines.append(f"- 错误详情：{data['freshness_error']}")
          else:
              lines.append("- 未生成 `source_freshness.json`（抓数阶段可能出现网络异常或超时）。")
          print("\n".join(lines))
          PY
          )
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${GITHUB_REPOSITORY}" --body "${BODY}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}"
          fi

      - name: Auto-close failure alert on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[告警] 每日报告生成失败"
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -n "${EXISTING}" ]; then
            DATA_DATE=$(python -c "import json;print(json.load(open('output/data_snapshot.json'))['data_cutoff'])")
            gh issue close "${EXISTING}" --repo "${GITHUB_REPOSITORY}" --comment "每日报告已恢复正常（最新数据截止：${DATA_DATE}；运行记录：${RUN_URL}）。"
          fi
